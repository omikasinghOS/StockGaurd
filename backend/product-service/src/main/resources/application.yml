spring:
  application:
    name: product-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/product}
    username: ${DB_USER:product_user}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  jackson:
    deserialization:
      fail-on-unknown-properties: true
server:
  port: ${PORT:8080}
  error:
    include-message: never
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
logging:
  structured:
    format:
      console: logstash
product:
  url: ${PRODUCT_URL:http://localhost:8081}
security:
  jwt-secret: ${JWT_SECRET}
  cors-origins: ${CORS_ORIGINS:http://localhost:8080}
