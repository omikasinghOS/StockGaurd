name: stockguard-ai
x-backend: &backend
  restart: unless-stopped
  depends_on:
    postgres:
      condition: service_healthy
  healthcheck:
    test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/actuator/health"]
    interval: 15s
    timeout: 5s
    retries: 20
    start_period: 30s
services:
  postgres:
    build:
      context: .
      dockerfile: infrastructure/postgres.Dockerfile
    environment:
      POSTGRES_USER: stockguard
      POSTGRES_DB: stockguard
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Export POSTGRES_PASSWORD}
      DB_PASSWORD: ${DB_PASSWORD:?Export DB_PASSWORD}
    ports: ["127.0.0.1:5432:5432"]
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stockguard -d stockguard"]
      interval: 5s
      timeout: 5s
      retries: 20
  kafka:
    image: apache/kafka:3.9.1
    ports: ["127.0.0.1:9092:9092"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:29093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:29092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 20
    volumes: ["kafka-data:/tmp/kraft-combined-logs"]
  product-service:
    <<: *backend
    build:
      context: .
      dockerfile: backend/product-service/Dockerfile
    ports: ["127.0.0.1:8081:8080"]
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/product
      DEMO_ADMIN_PASSWORD: ${DEMO_ADMIN_PASSWORD:?Export DEMO_ADMIN_PASSWORD}
      DEMO_MANAGER_PASSWORD: ${DEMO_MANAGER_PASSWORD:?Export DEMO_MANAGER_PASSWORD}
      DEMO_VIEWER_PASSWORD: ${DEMO_VIEWER_PASSWORD:?Export DEMO_VIEWER_PASSWORD}
      DB_USER: product_user
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?Export JWT_SECRET}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080}
  inventory-service:
    <<: *backend
    build:
      context: .
      dockerfile: backend/inventory-service/Dockerfile
    ports: ["127.0.0.1:8082:8080"]
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/inventory
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      DB_USER: inventory_user
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?Export JWT_SECRET}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080}
  order-service:
    <<: *backend
    build:
      context: .
      dockerfile: backend/order-service/Dockerfile
    ports: ["127.0.0.1:8083:8080"]
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/order
      DB_USER: order_user
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?Export JWT_SECRET}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080}
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      PRODUCT_URL: http://product-service:8080
volumes:
  postgres-data:
  kafka-data:
